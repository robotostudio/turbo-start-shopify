sonar.projectKey=robotostudio_turbo-start-shopify
sonar.organization=robotostudio

sonar.sources=apps,packages
sonar.tests=apps/web/src
sonar.test.inclusions=**/__tests__/**/*.test.ts

# sanity.types.ts is emitted by `sanity typegen generate`; linting generated
# output only ever produces issues nobody can fix at the source.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/__tests__/**,**/sanity.types.ts

sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# S1441 wants single quotes; Biome formats with double quotes (biome.jsonc
# quoteStyle/jsxQuoteStyle), so every string literal would be flagged.
sonar.issue.ignore.multicriteria=q1,q2
sonar.issue.ignore.multicriteria.q1.ruleKey=typescript:S1441
sonar.issue.ignore.multicriteria.q1.resourceKey=**/*
sonar.issue.ignore.multicriteria.q2.ruleKey=javascript:S1441
sonar.issue.ignore.multicriteria.q2.resourceKey=**/*
