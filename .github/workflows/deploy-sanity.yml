name: Deploy Sanity Studio
on:
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - ".github/workflows/deploy-sanity.yml"
      # `sanity` resolves through the catalog, so version bumps land here, not
      # in apps/studio/package.json. Without this the Studio serves a stale build.
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # `workflow_dispatch` accepts any ref, so the push filter alone is not a gate.
    if: github.ref == 'refs/heads/main'
    name: Build and Deploy Sanity Studio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
      NODE_OPTIONS: "--max_old_space_size=4096"
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET }}
      SANITY_STUDIO_TITLE: ${{ secrets.SANITY_STUDIO_TITLE }}
      SANITY_STUDIO_PRESENTATION_URL: ${{ secrets.SANITY_STUDIO_PRESENTATION_URL }}
      SANITY_STUDIO_PRODUCTION_HOSTNAME: ${{ secrets.SANITY_STUDIO_PRODUCTION_HOSTNAME }}
      HOST_NAME: ${{ github.head_ref || github.ref_name }}  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      # No `version` input on purpose: pnpm/action-setup reads the version from
      # the root package.json `packageManager` field. Passing both makes it
      # throw "Multiple versions of pnpm specified".
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
        
      - name: Deploy Sanity Studio
        working-directory: ./apps/studio
        run: |
          echo "Deploying Sanity Studio..."
          pnpm run deploy
        env:
          CI: true
