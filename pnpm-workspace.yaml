packages:
  - apps/*
  - packages/*

allowBuilds:
  "@tailwindcss/oxide": true
  core-js-pure: false
  esbuild: true
  sharp: true

catalog:
  # Held at 7: next-sanity 13.3.3 imports `unstable__adapter` from @sanity/client,
  # which v8 removed. Unpin when next-sanity ships a v8-compatible release.
  "@sanity/client": ^7.27.0
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^24.19.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/coverage-v8": ^4.1.11
  jsdom: ^29.1.1
  lucide-react: ^1.48.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sanity: 6.9.1
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: 5.9.3
  vitest: ^4.1.11
  zod: ^4.6.5

# Holds the Studio on the @sanity/ui v3 line — the "Sanity Studio pins" note
# in CLAUDE.md carries the why (ROB-2754). Keep it there: pnpm rewrites this
# file on `pnpm update` and drops comments.
overrides:
  # Dedupes sanity-plugin-lucide-icon-picker (depends on ^0.532.0) onto the
  # catalog copy: two copies means it offers icon names the renderers can't draw.
  lucide-react: ^1.48.0
  # Transitive: @sanity/orderable-document-list asks for ^2.0.13, and 2.0.14 is
  # already on @sanity/ui v4.
  sanity-plugin-utils: 2.0.18
