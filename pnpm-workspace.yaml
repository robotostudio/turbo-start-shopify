# Holds the Studio on the @sanity/ui v3 line, alongside the exact pins in
# apps/studio/package.json. sanity-plugin-utils sits here rather than there
# because it is transitive: @sanity/orderable-document-list asks for ^2.0.13
# and 2.0.14 is already on v4. See the "Sanity Studio pins" note in CLAUDE.md —
# pnpm rewrites this file on `pnpm update` and drops comments, so the full
# reasoning lives there rather than here.
overrides:
  sanity-plugin-utils: 2.0.13
